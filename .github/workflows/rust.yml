name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Prima di tutto: non costa niente e non ha bisogno di compilare.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # zion-core/build.rs compila proto/zion.proto con tonic-build
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  nexus:
    name: Nexus - build, account e sincronizzazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nexus/package-lock.json

      # `npm ci` fallisce se il lockfile e' rotto o non combacia con
      # package.json: e' il controllo che mancava quando ci e' finito dentro
      # un conflitto di merge.
      - name: Install
        working-directory: nexus
        run: npm ci

      - name: Build (vue-tsc + vite)
        working-directory: nexus
        run: npm run build

      - name: Test dati e migrazione
        working-directory: nexus
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: nexus/server/requirements*.txt

      - name: Install API
        working-directory: nexus
        run: |
          python -m venv server/.venv
          server/.venv/bin/pip install -r server/requirements-test.txt

      - name: Test account, isolamento, backup e concorrenza
        working-directory: nexus
        run: npm run test:api

      - name: Install browser
        working-directory: nexus
        run: npx playwright install --with-deps chromium

      - name: Test browser desktop, mobile e due dispositivi
        working-directory: nexus
        run: npx playwright test
