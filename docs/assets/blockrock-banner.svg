  <text x="75" y="102" fill="#9dc9b8" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">PERSONE · TECNOLOGIA · FIDUCIA</text>
  <text x="70" y="190" fill="#f2f6f6" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="4">BLOCKROCK</text>
  <text x="74" y="239" fill="#b6c8ce" font-family="Arial,sans-serif" font-size="24">Ogni scelta lascia una traccia.</text>
  <text x="74" y="274" fill="#b6c8ce" font-family="Arial,sans-serif" font-size="24">Ogni percorso può trovare il suo equilibrio.</text>
