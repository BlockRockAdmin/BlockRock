<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BlockRock</title>
  <desc id="desc">Una rete di scelte, un percorso verso la stabilità.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b141d"/><stop offset="1" stop-color="#1b313e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#94caba" stop-opacity=".18"/><stop offset="1" stop-color="#94caba" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="914" cy="180" r="174" fill="url(#glow)"/>
  <g fill="none" stroke-width="1.2">
    <circle cx="914" cy="123" r="98" stroke="#e9a3a2" stroke-opacity=".76" fill="#e9a3a2" fill-opacity=".10"/>
    <circle cx="970" cy="180" r="98" stroke="#b1b7ed" stroke-opacity=".76" fill="#b1b7ed" fill-opacity=".10"/>
    <circle cx="914" cy="237" r="98" stroke="#8dcab6" stroke-opacity=".76" fill="#8dcab6" fill-opacity=".10"/>
    <circle cx="858" cy="180" r="98" stroke="#e3c185" stroke-opacity=".76" fill="#e3c185" fill-opacity=".10"/>
    <circle cx="914" cy="180" r="149" stroke="#a8c6c0" stroke-opacity=".32" stroke-dasharray="2 8"/>
