    <circle cx="914" cy="123" r="98" stroke="#ff355e" stroke-opacity=".76" fill="#ff355e" fill-opacity=".10"/>
    <circle cx="970" cy="180" r="98" stroke="#59f5a8" stroke-opacity=".76" fill="#59f5a8" fill-opacity=".10"/>
    <circle cx="914" cy="237" r="98" stroke="#29bd7b" stroke-opacity=".76" fill="#29bd7b" fill-opacity=".10"/>
